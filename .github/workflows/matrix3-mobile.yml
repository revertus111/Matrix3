name: Matrix3 Mobile APK

on:
  push:
    branches: [ main ]
    paths:
      - 'Mobile/**'
      - 'Server/**'
      - '.github/workflows/matrix3-mobile.yml'
  workflow_dispatch:

jobs:
  build-mobile-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        run: bash Server/gradlew -p Mobile :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: matrix3-mobile-debug
          path: Mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
